name: Demo 09 - Action Pinning

on:
  workflow_dispatch:

jobs:
  audit-pinning:
    runs-on: ubuntu-latest
    steps:
      # Best Practice: Pin to immutable 40-character commit SHA with version comment
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Verify runtime
        run: node --version