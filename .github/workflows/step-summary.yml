name: Step Summary

on:
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Run test suite
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 📋 Test Suite Executive Summary

          | Metric | Status / Count |
          | :--- | :--- |
          | **Total Tests** | 50 |
          | **Passed** | 48 ✅ |
          | **Failed (Ignored)** | 2 ⚠️ |
          | **Code Coverage** | **85%** 🚀 |
          EOF

      # Multiple steps append sequentially to the same summary file
      # Size Limit Rule: Max 1024 KiB (1 MB) per job
      - name: Generate deployment checklist
        if: ${{ !cancelled() }}
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ### 🚀 Deployment Readiness
          - [x] Unit tests passing target threshold
          - [x] Linter clean
          - [ ] Manual staging sign-off required
          EOF