name: AWS OIDC

on:
  workflow_dispatch:

# Core Requirement: id-token: write is mandatory to mint the GitHub OIDC JWT
permissions:
  id-token: write
  contents: read

jobs:
  cloud-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Debug OIDC Sub Claim
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Your exact sub claim is:"
          echo "$TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson | .sub'

      # Best Practice: Passwordless temporary STS credential exchange
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308639168576:role/GitHubActionsWorkflowRole # Replace with your IAM Role ARN
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS Caller Identity
        run: aws sts get-caller-identity

      # 3. LIVE DATA FETCH: Query AWS S3
      - name: Fetch Real Data from AWS (List S3 Buckets)
        run: |
          echo "=== 📦 Fetching S3 Buckets from AWS via OIDC ==="
          aws s3 ls