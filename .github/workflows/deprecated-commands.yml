name: Output Commands

on:
  workflow_dispatch:

jobs:
  output-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Generate output (Legacy Syntax)
        id: legacy_step
        run: |
          echo "app_version=1.0.0" >> "$GITHUB_OUTPUT"


      - name: Consume output
        run: |
          echo "Consumed Version: ${{ steps.legacy_step.outputs.app_version }}"