name: Artifact Attestation

on:
  workflow_dispatch:

# Core Requirement: The 3 permissions required for cryptographic provenance signing
permissions:
  contents: read
  id-token: write      # Mints OIDC token for Sigstore identity certificate
  attestations: write  # Uploads the signed attestation bundle to GitHub

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package release artifact
        run: tar -czf release-artifact.tar.gz package.json

      # Best Practice: Cryptographically sign the artifact using Sigstore
      - name: Attest artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: 'release-artifact.tar.gz'

      # Cryptographically verify the signed provenance using GitHub CLI
      - name: Verify artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release-artifact.tar.gz --repo "${GITHUB_REPOSITORY}"